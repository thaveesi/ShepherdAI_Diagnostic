[project]
name = "shepherd-scan"
version = "0.3.9"
description = "Finds the AI agents, connected tools and add-ons on this computer and checks them."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Shepherd-Scan"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt", "LICENSES/*"]
# Versions match the combination the discovery code was tested with upstream.
dependencies = [
    "detect-secrets==1.5.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "lark==1.3.1",
    "mcp==1.30.0",
    "pydantic==2.12.5",
    "pyjson5==2.0.0",
    "pyyaml==6.0.3",
    "regex==2026.4.4",
    "rich==14.2.0",
]

[project.scripts]
shepherd-scan = "shepherd_scan.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
# Third-party code under _vendor, and the tests that came with it under
# tests/discovery, are kept close to their source so fixes can be carried over;
# they are covered by their own tests rather than our lint rules.
extend-exclude = ["src/shepherd_scan/_vendor", "tests/discovery"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF", "S", "C90", "PL", "D"]
ignore = ["D203", "D213", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "D", "PLR0913", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
# Carried over from upstream, as for ruff above.
exclude = ["src/shepherd_scan/_vendor", "tests/discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-lazy-fixtures==1.4.1",
    "ruff==0.17.0",
    "ty==0.0.87",
]
